# Nginx: el front (Next.js, puerto 3000) y la API (NestJS, puerto 4000) bajo el mismo dominio, con HTTPS.
# Copiar a /etc/nginx/sites-available/sigap y enlazar en sites-enabled.
# Certificado (Let's Encrypt, lo tramita TI del CIDETEC) en /etc/ssl/sigap/: fullchain.pem y privkey.pem.

# Por dominio en HTTP: se manda a HTTPS (salvo la validación de Let's Encrypt)
server {
    listen 80;
    server_name virtual.cidetec.ipn.mx www.virtual.cidetec.ipn.mx;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://virtual.cidetec.ipn.mx$request_uri;
    }
}

# www → dominio principal
server {
    listen 443 ssl;
    http2 on;
    server_name www.virtual.cidetec.ipn.mx;
    ssl_certificate     /etc/ssl/sigap/fullchain.pem;
    ssl_certificate_key /etc/ssl/sigap/privkey.pem;
    return 301 https://virtual.cidetec.ipn.mx$request_uri;
}

# Sitio principal en HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name virtual.cidetec.ipn.mx;

    ssl_certificate     /etc/ssl/sigap/fullchain.pem;
    ssl_certificate_key /etc/ssl/sigap/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Actas firmadas en PDF (la API acepta hasta 10 MB)
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Acceso por IP (http://148.204.67.192): sigue funcionando sin HTTPS mientras tanto
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
