# Nginx: el front (Next.js, puerto 3000) y la API (NestJS, puerto 4000) bajo el mismo dominio.
# Copiar a /etc/nginx/sites-available/sigap y enlazar en sites-enabled.
server {
    listen 80;
    server_name virtual.cidetec.ipn.mx;

    # Actas firmadas en PDF (la API acepta hasta 10 MB)
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
